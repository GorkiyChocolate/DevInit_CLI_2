services:
  postgresql:
    image: postgres:16
    ports:
    - 5432:5432
    restart: unless-stopped
    labels:
      com.devinit.description: PostgreSQL database
  redis:
    image: redis:7
    ports:
    - 6379:6379
    restart: unless-stopped
    labels:
      com.devinit.description: Redis in-memory data store
