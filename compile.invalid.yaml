services:
  - name: backend
    description: Invalid backend service
    image: ""
    ports:
      - "8080:0"
    depends_on:
      - postgres

kubernetes:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: backend
  spec:
    replicas: 0
    selector:
      matchLabels: {}
    template:
      metadata:
        name: backend
      spec:
        containers:
          - name: backend
            image: ""

cicd:
  provider: github
  jobs:
    - name: deploy
      needs:
        - build
      steps:
        - name: Deploy
          action: run
          command: cargo run
