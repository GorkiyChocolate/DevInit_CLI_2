project:
  name: "auth-gateway"
  version: "1.0.0"
  description: "High-performance microservice"

variables:
  DATABASE_URL:
    type: "secret"
    required: true
  RUST_LOG:
    type: "string"
    default: "info"

networks:
  internal_net:
    type: "bridge"
    internal: true

volumes:
  pg_data:
    type: "persistent"
    size: "10Gi"
  app_cache:
    type: "tmpfs"

services:
  gateway:
    type: "api"
    runtime:
      language: "rust"
      version: "1.80"
    build:
      context: "."
      dockerfile: "Dockerfile"
    ports:
      - container: 8080
        host: 8080
    routing:
      host: "api.example.com"
      tls: true
      paths:
        - path: "/v1/auth"
          target_port: 8080
    environment:
      RUST_LOG:
        variable: "RUST_LOG"
      DB_DSN:
        secret: "app-secrets"
        key: "db_conn"
    storage:
      - volume: "app_cache"
        mount: "/tmp/cache"
    depends_on:
      postgres: "healthy"
    networks:
      - "internal_net"
    resources:
      cpu:
        request: "200m"
        limit: "1000m"
      memory:
        request: "128Mi"
        limit: "512Mi"
    replicas:
      min: 2
      max: 5

  postgres:
    type: "database"
    image:
      name: "postgres"
      tag: "16-alpine"
    environment:
      POSTGRES_DB: "auth_db"
    storage:
      - volume: "pg_data"
        mount: "/var/lib/postgresql/data"
    networks:
      - "internal_net"

pipeline:
  stages:
    - name: "test"
      steps:
        - name: "Run Unit Tests"
          command: "cargo test --all"
    - name: "build"
      steps:
        - name: "Linting"
          command: "cargo clippy -- -D warnings"

environments:
  production:
    variables:
      RUST_LOG: "warn"
    services:
      gateway:
        replicas:
          min: 5
          max: 20